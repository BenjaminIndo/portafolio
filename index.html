      rel="stylesheet"
    />
    <script>
      // Aplica el tema antes de pintar para evitar un destello de color.
      ;(function () {
        var t
        try {
          t = localStorage.getItem('tema')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
